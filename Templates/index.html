<!DOCTYPE html>
<html>
<head>
    <title>AI Support Chatbot</title>
    <style>
        body { font-family: Arial; background-color: #eef2f3; display: flex; justify-content: center; margin-top: 50px; }
        .container { width: 380px; background: white; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); overflow: hidden; }
        .header { background: linear-gradient(135deg, #4f46e5, #7c3aed); color: white; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; }
        .chat-area { height: 320px; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 10px; border-radius: 8px; max-width: 75%; font-size: 14px; }
        .user { background: #3498db; color: white; align-self: flex-end; }
        .bot { background: #ecf0f1; color: #333; align-self: flex-start; }
        .input-box { display: flex; border-top: 1px solid #ddd; }
        input { flex: 1; padding: 12px; border: none; outline: none; }
        button { background: #2c3e50; color: white; border: none; padding: 12px 18px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div><div class="header-title"> Vrinda AI Support</div><span class="status">● Online | Ready to help</span></div>
        <button class="clear-btn" onclick="clearChat()">Clear</button>
    </div>
    <div class="chat-area" id="chatArea">
        <div class="msg bot">Hi! Ask me about internship, projects, or certificate.</div>
    </div>
    
    <div class="input-box">
        <input type="text" id="userInput" placeholder="Type your message..." onkeypress="if(event.key==='Enter') sendMsg()">
        <button onclick="sendMsg()">Send</button>
    </div>
</div>

<script>
    function clearChat() {
        let time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        document.getElementById("chatArea").innerHTML = `
            <div class="msg-wrapper bot-wrapper">
                <div class="msg bot">Chat cleared! How can I help you?</div>
                <span class="time">${time}</span>
                        </div>`;
                    }

    async function sendMsg() {
        let input = document.getElementById("userInput");
        let text = input.value.trim();
        if (!text) return;

        addBubble(text, "user");
        input.value = "";

        let response = await fetch("/ask", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: text })
        });
        let data = await response.json();
        addBubble(data.reply, "bot");
    }

    function addBubble(text, sender) {
    let time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    let wrapper = document.createElement("div");
    wrapper.className = "msg-wrapper " + sender + "-wrapper";
    wrapper.innerHTML = `<div class="msg ${sender}">${text}</div><span class="time">${time}</span>`;
    let area = document.getElementById("chatArea");
    area.appendChild(wrapper);
    area.scrollTop = area.scrollHeight;
}

    
</script>

</body>
</html>
